<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Portfolio - Immersive Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay */
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .header {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 200;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #d4af37, #f0d680);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.3));
            animation: glow-pulse 3s ease-in-out infinite;
        }

        .header p {
            font-size: 1rem;
            letter-spacing: 2px;
            color: #aaa;
            margin-top: 10px;
            animation: fade-in 2s ease-out;
        }

        @keyframes glow-pulse {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.3)); }
            50% { filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.6)); }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Section Labels */
        .section-label {
            position: fixed;
            left: 50px;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(212, 175, 55, 0.6);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }

        .section-label.active {
            opacity: 1;
        }

        /* Navigation Dots */
        .nav-dots {
            position: fixed;
            right: 50px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 30px;
            z-index: 200;
            pointer-events: auto;
        }

        .nav-dot {
            width: 12px;
            height: 12px;
            border: 2px solid rgba(212, 175, 55, 0.5);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0);
        }

        .nav-dot:hover {
            background: rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
        }

        .nav-dot.active {
            background: #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 1);
            transform: scale(1.5);
        }

        /* Scroll Hint */
        .scroll-hint {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: rgba(212, 175, 55, 0.4);
            font-size: 0.9rem;
            letter-spacing: 1px;
            animation: bounce 2s infinite;
            pointer-events: none;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-15px); }
        }

        .scroll-arrow {
            display: block;
            font-size: 1.5rem;
            margin-top: 5px;
            animation: scroll-float 1.5s ease-in-out infinite;
        }

        @keyframes scroll-float {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Info Panel */
        .info-panel {
            position: fixed;
            bottom: 50px;
            left: 50px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 20px;
            width: 300px;
            backdrop-filter: blur(10px);
            pointer-events: auto;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease;
        }

        .info-panel.active {
            opacity: 1;
            transform: translateY(0);
        }

        .info-panel h3 {
            color: #d4af37;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .info-panel p {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* Interactive hint */
        .interactive-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(212, 175, 55, 0.6);
            font-size: 1rem;
            pointer-events: none;
            animation: fade-in-out 3s infinite;
        }

        @keyframes fade-in-out {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* Loading screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fade-out 1s ease-out 2s forwards;
        }

        @keyframes fade-out {
            from { opacity: 1; }
            to { opacity: 0; pointer-events: none; }
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="loading-screen">
        <div class="loading-spinner"></div>
    </div>

    <div class="ui-overlay">
        <div class="header">
            <h1>3D PORTFOLIO</h1>
            <p>IMMERSIVE EXPERIENCE</p>
        </div>

        <div class="nav-dots">
            <div class="nav-dot active" data-section="0"></div>
            <div class="nav-dot" data-section="1"></div>
            <div class="nav-dot" data-section="2"></div>
            <div class="nav-dot" data-section="3"></div>
        </div>

        <div class="section-label" style="top: 50%; transform: translateY(-50%);">
            Welcome
        </div>

        <div class="scroll-hint">
            SCROLL TO EXPLORE
            <span class="scroll-arrow">↓</span>
        </div>

        <div class="info-panel">
            <h3>NEURAL SPHERE</h3>
            <p>Experience the fusion of design and technology. Click to explore, scroll to navigate through the immersive 3D world.</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/postprocessing/DepthOfFieldPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/shaders/BokehShader.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
